name: Build and deploy
# Rebuild updated Local Edit source for current Discord module changes

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build plugin(s)
        run: node ./build.mjs

      - name: Add documentation files
        run: |
          cp README.md dist/README.md
          cp plugins/localedit/index.html dist/localedit/index.html
          printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
          printf -- "> **Note:** You accessed a link that returned a 404. Copy the plugin URL into a compatible client's Plugins page.\n\n" >> dist/404.md
          cat README.md >> dist/404.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: true
